networks:
  healthcheck_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.100.0/24

# image is built once by healthchecker1; the other four reuse it
x-healthchecker: &healthchecker
  image: ngx-healthchecker
  pull_policy: never
  cap_add:
    - NET_ADMIN
  command: python3 -m healthchecker.main --port 8082
  restart: unless-stopped

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    cap_add:
      - NET_ADMIN
    volumes:
      # mount the directory, not the single file: a single-file bind mount keeps the old
      # inode when an editor replaces the file, so the container sees a stale/truncated copy.
      # nginx.conf is the only config nginx reads (no include).
      - ./nginx:/etc/nginx:ro
      # all nginx logs land in ./nginx/log on the host
      - ./nginx/log:/var/log/nginx
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.100
    ports:
      - "80:80"       # legacy
      - "8080:8080"   # legacy copy (split test step 1)
      - "8081:8081"   # front door (split test step 2)
      - "8090:8090"   # stream (TCP L4) -> dbsrv:211
    mem_limit: 10g
    cpus: 1.0
    depends_on:
      - healthchecker1
      - healthchecker2
      - healthchecker3
      - healthchecker4
      - healthchecker5
      - dbsrv

  healthchecker1:
    <<: *healthchecker
    build: ./healthchecker
    pull_policy: build   # always (re)build on `docker compose up`; cached, so fast
    container_name: healthchecker1
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.101

  healthchecker2:
    <<: *healthchecker
    container_name: healthchecker2
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.102

  healthchecker3:
    <<: *healthchecker
    container_name: healthchecker3
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.103

  healthchecker4:
    <<: *healthchecker
    container_name: healthchecker4
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.104

  healthchecker5:
    <<: *healthchecker
    container_name: healthchecker5
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.105

  dbsrv:
    build: ./dbsrv
    image: dbsrv
    pull_policy: build
    container_name: dbsrv
    cap_add:
      - NET_ADMIN
    command: python3 -m dbsrv.main
    restart: unless-stopped
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.200

version: "3.9"

networks:
  healthcheck_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.100.0/24

services:

  nginx:
    image: ngx-source
    container_name: nginx
    cap_add:
      - NET_ADMIN
    command: bash -c "/usr/sbin/nginx -g 'daemon off;'"
    volumes:
      - ./nginx_source/docker_backend.conf:/etc/nginx/conf.d/docker_backend.conf:ro
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.100
    ports:
      - "8080:8080"

  healthchecker1:
    image: ngx-healthchecker
    container_name: healthchecker1
    cap_add:
      - NET_ADMIN
    command: >
      bash -c "python3 -m project.main --port 8082 && sleep infinity"
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.101

  healthchecker2:
    image: ngx-healthchecker-test
    container_name: healthchecker2
    cap_add:

version: "3.9"

networks:
  healthcheck_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.100.0/24

services:

  nginx:
    image: nginx:latest
    container_name: nginx
    cap_add:
      - NET_ADMIN
    command: bash -c "/usr/sbin/nginx -g 'daemon off;'"
    volumes:
      - ./nginx/docker_backend.conf:/etc/nginx/conf.d/docker_backend.conf:ro
      - ./nginx/ssl/example.crt:/etc/nginx/ssl/example.crt:ro
      - ./nginx/ssl/example.key:/etc/nginx/ssl/example.key:ro
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./nginx/stream.d:/etc/nginx/stream.d:ro
      #rm -f /var/log/nginx/access.log
      #rm -f /var/log/nginx/error.log
      #touch /var/log/nginx/access.log
      ##touch /var/log/nginx/error.log
      #chmod 644 /var/log/nginx/*.log
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.100
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    mem_limit: 10g
    cpus: 1.0
  
  dbsrv:
    image: dbsrv
    container_name: dbsrv
    cap_add:
      - NET_ADMIN
    command: >
      bash -c "python3 -m dbsrv.main && sleep infinity"
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.200
  
  healthchecker1:
    image: ngx-healthchecker
    container_name: healthchecker1
    cap_add:
      - NET_ADMIN
    command: >
      bash -c "python3 -m project.main --port 8082 && sleep infinity"
    networks:
      healthcheck_net:
        ipv4_address: 10.100.100.101

  healthchecker2:

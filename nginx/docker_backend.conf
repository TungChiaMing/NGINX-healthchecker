upstream docker_backends {
    server 10.100.100.101:8082 max_fails=1 fail_timeout=100s;
    server 10.100.100.102:8082 max_fails=1 fail_timeout=100s;
    server 10.100.100.103:8082 max_fails=1 fail_timeout=100s;
    server 10.100.100.104:8082 max_fails=1 fail_timeout=100s;
    server 10.100.100.105:8082 max_fails=1 fail_timeout=100s;
    keepalive 32;
}

server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://docker_backends;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_404;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
    }

    location /nginx_status {
        stub_status;
        allow 0.0.0.0/0;
        deny all;
    }
}
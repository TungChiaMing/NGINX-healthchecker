worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    keepalive_timeout 65s;
    gzip off;
    client_max_body_size 1m;
    server_names_hash_bucket_size 32;
    client_header_buffer_size 1k;
    client_body_buffer_size 8k;

    log_format basic '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    map $server_port $hop {
        8081    frontdoor;
        default legacy;
    }

    map $server_port $split_log {
        8081    $route;
        default "-";
    }

    map $upstream_addr $served_by {
        "10.100.100.101:8082" healthchecker1;
        "10.100.100.102:8082" healthchecker2;
        "10.100.100.103:8082" healthchecker3;
        "10.100.100.104:8082" healthchecker4;
        "10.100.100.105:8082" healthchecker5;
        default               $upstream_addr;
    }

    log_format split_json escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$http_x_request_id",'
        '"port":"$server_port",'
        '"hop":"$hop",'
        '"split":"$split_log",'
        '"client":"$remote_addr",'
        '"peer":"$realip_remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":"$status",'
        '"bytes":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"served_by":"$served_by",'
        '"xff":"$http_x_forwarded_for"}';


    access_log /var/log/nginx/access.json split_json;
    error_log /var/log/nginx/error.log;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    #resolver xxx.xxx.xxx.xxx valid=30s;

    upstream docker_backends {
        zone docker_backends 64k;
        # server 10.100.100.200:211 max_conns=1 max_fails=1 fail_timeout=100s;
        server 10.100.100.101:8082 fail_timeout=100s max_conns=1 max_fails=1;
        server 10.100.100.102:8082 fail_timeout=100s max_fails=1;
        server 10.100.100.103:8082 fail_timeout=100s max_fails=1;
        #server 10.100.100.104:8082 fail_timeout=100s max_fails=1;
        server 10.100.100.105:8082 fail_timeout=100s max_fails=1;
    }

    upstream new_80 {
        server 127.0.0.1:80;
        # server xxx.com.tw:80;
    }

    upstream legacy_8080 {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    }
    
    # 1.把upstream new_80 註解交換
    # 2.listen 80 ;註解掉
    # 3.listen 8081 ;改成listen 80;
    # 4.logformat 改 80 port
    split_clients $request_id $split_target {
        50%     new_80;
        *       legacy_8080;
    }

    map $http_x_canary $route {
        80      new_80;
        8080    legacy_8080;
        default $split_target;
    }
    
    map $route $upstream_host {
        new_80  xxx.com.tw; 
        default      $host;
    }

    server {
        listen 80 ;
        listen 8080 ;
        
        location /healthcheck/ {
            proxy_pass http://docker_backends/;
        }

        location /nginx_conf/ {
            alias /etc/nginx/;
            autoindex on;
            default_type text/plain;
        }

        location /nginx_log {
            alias /var/log/nginx/;
            autoindex on;
            default_type text/plain;
        }
        
        
    }

    server {
        listen 8081 ;

        location / {
            proxy_pass http://$route;
            proxy_set_header Host $upstream_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_redirect http://xxx.com.tw/ /;

            #proxy_redirect ~^https?://(xxx\.com\.tw|localhost|127\.0\.0\.1)(:\d+)?$ /;
            #proxy_redirect ~^https?://(xxx\.com\.tw|localhost|127\.0\.0\.1)(:\d+)?(/.*)$ $3;
            error_page 502 503 504 = @legacy; 
            proxy_connect_timeout 2s;  
        }

        location @legacy {
            proxy_pass http://legacy_8080;
            proxy_set_header Host $host; 
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect http://$host:8080/ /; 
        }

    }
}


stream {
    log_format basic '$remote_addr [$time_local] '
        '$protocol $status $bytes_sent $bytes_received '
        '$session_time -> $upstream_addr '
        '$upstream_bytes_sent $upstream_bytes_received $upstream_connect_time';
    access_log /var/log/nginx/stream_access.log basic;
    error_log /var/log/nginx/stream_error.log warn;

    server {
        listen 8090;
        proxy_pass 10.100.100.200:211;
        proxy_connect_timeout 60s;
        proxy_timeout 60s;
        access_log off;
    }
}
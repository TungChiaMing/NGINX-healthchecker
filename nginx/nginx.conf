worker_processes auto;
pid /run/nginx.pid;
events {
    worker_connections 1024;
}
# ------------------
# HTTP 設定
# ------------------
http {
    include /etc/nginx/conf.d/*.conf;
    log_format basic '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';
    # HTTP 預設 log，不用指定 format
    access_log /var/log/nginx/http_access.log basic;
    error_log /var/log/nginx/http_error.log warn;
    include /etc/nginx/sites-enabled/*;
    keepalive_timeout 65s;
    gzip off;
    gzip_min_length 1;
    gzip_comp_level 1;
    client_max_body_size 1m;
    server_names_hash_bucket_size 32;
    client_header_buffer_size 1k;
    client_body_buffer_size 8k;
    proxy_cache_path /var/cache/nginx/proxy_cache levels=1:2 use_temp_path=off keys_zone=proxy_cache:10m inactive=60m max_size=1g;
}
# ------------------
# Stream 設定
# ------------------
stream {
    include /etc/nginx/stream.d/*.conf;
    # stream access_log 直接寫檔案，不支援 log_format
    log_format basic '$remote_addr [$time_local] '
        '$protocol $status $bytes_sent $bytes_received '
        '$session_time -> $upstream_addr '
        '$upstream_bytes_sent $upstream_bytes_received $upstream_connect_time';
    access_log /var/log/nginx/stream_access.log basic;
    error_log /var/log/nginx/stream_error.log warn;
    include /etc/nginx/streams-enabled/*;
}
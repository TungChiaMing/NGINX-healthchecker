# New Nginx: a second, independent Nginx process.
# Only the Legacy Nginx talks to it.
worker_processes 1;
pid /run/split/new.pid;
error_log /var/log/split/new-error.log warn;

events {
    worker_connections 512;
}

http {
    log_format hop escape=json '{"t":"$msec","nginx":"new","hop":"new nginx","port":"$server_port","request_id":"$http_x_request_id","uri":"$request_uri","status":"$status","request_time":"$request_time","peer":"$remote_addr"}';

    server {
        listen 127.0.0.1:8082;
        access_log /var/log/split/new-access.log hop;

        location / {
            default_type application/json;
            return 200 '{"served_by":"new_nginx","port":"$server_port","request_id":"$http_x_request_id","x_forwarded_for":"$http_x_forwarded_for"}';
        }
    }
}
